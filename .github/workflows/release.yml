name: Release

# Push a tag like v0.2.0 to build the Windows installer and publish it
# (plus the update manifest electron-updater reads) to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # The VST3 SDK is a ~243 MB third-party dependency and is deliberately
      # not committed (see native/README.md) — fetch it the same way local
      # dev does before the native addon can compile against its headers.
      - name: Fetch VST3 SDK
        run: git clone --recurse-submodules --depth 1 --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git native/vst3sdk

      # windows-latest ships Visual Studio 2022 (Desktop C++ workload),
      # CMake and Python already installed, so node-gyp has everything it
      # needs without extra setup steps.
      - name: Build the native VST3 host addon
        working-directory: native/vst3host
        run: npx node-gyp rebuild

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the installer
        run: npm run build:installer

      # Published in ONE step rather than through electron-builder's own
      # GitHub publisher: that uploads each artifact separately and can race
      # with itself, producing two half-filled draft releases for a single
      # tag. electron-updater would then be free to resolve the one without
      # an installer in it. gh is preinstalled on the runner.
      #
      # latest.yml is what electron-updater reads to discover a new version,
      # so it matters as much as the .exe; the .blockmap lets updates
      # download only changed chunks. Kept as a draft so the release is
      # reviewed before it reaches anyone.
      - name: Publish to GitHub Releases
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/SuperDAW-Setup-*.exe \
            release/SuperDAW-Setup-*.exe.blockmap \
            release/latest.yml \
            --draft \
            --title "SuperDAW $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
