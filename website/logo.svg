<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SuperDAW">
  <title>SuperDAW</title>
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4238" />
      <stop offset="35%" stop-color="#2C2620" />
      <stop offset="70%" stop-color="#3D2418" />
      <stop offset="100%" stop-color="#1A1512" />
    </linearGradient>

    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B0A45" />
      <stop offset="45%" stop-color="#8A1E6C" />
      <stop offset="100%" stop-color="#B33A3A" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="45%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>

    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6EC7" />
      <stop offset="45%" stop-color="#FFB627" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>

    <pattern id="scratches" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="8" x2="34" y2="8" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
      <line x1="0" y1="21" x2="34" y2="21" stroke="#000000" stroke-width="0.35" opacity="0.1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="diamondClip">
      <path d="M 256 56 L 456 256 L 256 456 L 56 256 Z"/>
    </clipPath>
    <clipPath id="portholeClip">
      <circle cx="256" cy="273" r="103"/>
    </clipPath>
  </defs>

  <path d="M 256 56 L 456 256 L 256 456 L 56 256 Z"
        fill="url(#metalGrad)" stroke="#FF7A1A" stroke-width="3.4" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 256 56 L 456 256 L 256 456 L 56 256 Z" fill="url(#scratches)" clip-path="url(#diamondClip)"/>

  <path d="M 256 56 L 456 256 L 256 456 L 56 256 Z"
        fill="none" stroke="#00E5FF" stroke-width="1.3" opacity="0.5"/>

  <g clip-path="url(#portholeClip)">
    <rect x="153" y="170" width="206" height="206" fill="url(#sunsetGrad)"/>
    <circle cx="256" cy="298" r="63" fill="url(#sunGrad)" filter="url(#glow)"/>
    <rect x="153" y="270" width="206" height="5" fill="#2B0A45"/>
    <rect x="153" y="285" width="206" height="5" fill="#2B0A45"/>
    <rect x="153" y="303" width="206" height="5" fill="#2B0A45"/>
    <rect x="153" y="326" width="206" height="5" fill="#2B0A45"/>
    <line x1="182" y1="376" x2="223" y2="256" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>
    <line x1="330" y1="376" x2="289" y2="256" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>
  </g>
  <circle cx="256" cy="273" r="103" fill="none" stroke="#FF7A1A" stroke-width="5"/>
  <circle cx="256" cy="273" r="103" fill="none" stroke="#00E5FF" stroke-width="1.6" opacity="0.6"/>

  <circle cx="256" cy="56" r="6.5" fill="#6B5D4A" stroke="#1A1512" stroke-width="1.6"/>
  <circle cx="456" cy="256" r="6.5" fill="#6B5D4A" stroke="#1A1512" stroke-width="1.6"/>
  <circle cx="256" cy="456" r="6.5" fill="#6B5D4A" stroke="#1A1512" stroke-width="1.6"/>
  <circle cx="56" cy="256" r="6.5" fill="#6B5D4A" stroke="#1A1512" stroke-width="1.6"/>

  <!-- Web variant of resources/icon-source.svg: the Google Fonts @import is dropped
       (no external requests from the site) and "SD" uses a heavy system stack instead. -->
  <text x="256" y="420" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-weight="700"
        font-size="56" text-anchor="middle" fill="url(#letterGrad)" filter="url(#glow)"
        stroke="#1A1512" stroke-width="1.6" letter-spacing="-1">SD</text>
</svg>
